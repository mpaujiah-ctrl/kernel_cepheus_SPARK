name: Update KSUN
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pyro-34
      - name: Replace drivers/staging/kernelsu
        run: |
            git clone --depth 1 --branch v3.4.0-legacy https://github.com/KernelSU-Next/KernelSU-Next.git /tmp/ksun
            rm -rf drivers/staging/kernelsu
            mkdir -p drivers/staging/kernelsu
            cp -a /tmp/ksun/kernel/. drivers/staging/kernelsu/
            rm -f drivers/staging/kernelsu/include/uapi
            mkdir -p drivers/staging/kernelsu/include/uapi
            cp /tmp/ksun/uapi/*.h drivers/staging/kernelsu/include/uapi/
            sed -i 's/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := 33333/' drivers/staging/kernelsu/Kbuild
                 
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A drivers/staging/kernelsu
          git commit -m "kernelsu: update KernelSU-Next to v3.4.0 legacy" || echo "nothing to commit"
          git push
