name: Apply SUSFS
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13_ksu_susfs
      - name: Replace drivers/kernelsu
        run: |            
          git apply --directory=drivers/kernelsu susfs_v2.patch
     
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A drivers/kernelsu
          git commit -m "fs: implement susfs v2.0.0" || echo "nothing to commit"
          git push
